name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un solo run por rama: si llegan dos pushes seguidos, el viejo se cancela.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, typecheck y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # El cliente de Prisma se genera antes del typecheck: los tipos de
      # @prisma/client no existen hasta que corre `prisma generate`.
      - name: Generar cliente de Prisma
        run: npm run db:generate -w @gina/api

      # `prisma validate` resuelve el env() del datasource, así que exige que
      # DATABASE_URL exista aunque nunca se conecte. Un valor de mentira basta:
      # aquí solo se valida la sintaxis del schema, no se toca ninguna base.
      - name: Validar schema de Prisma
        run: npx prisma validate --schema apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Compilar paquete compartido
        run: npm run build -w @gina/shared

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
